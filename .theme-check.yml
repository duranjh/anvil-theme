extends: theme-check:recommended
# Ignore patterns are anchored with a leading slash on purpose. Theme Check
# matches unanchored globs against the full path, so a bare `dev/**` also
# matched a checkout at ~/dev/anvil-theme and the gate inspected 0 files.
ignore:
  - /node_modules/**
  - /.harness/**
  - /dev/**
  - /docs/**
  - /scripts/**
AssetSizeCSS:
  enabled: true
  severity: error
  thresholdInBytes: 60000
AssetSizeJavaScript:
  enabled: true
  severity: error
  thresholdInBytes: 15000
RemoteAsset:
  severity: error
ParserBlockingScript:
  severity: error
ImgWidthAndHeight:
  severity: error
UnusedAssign:
  severity: error
