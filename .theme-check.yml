extends: theme-check:recommended
# Ignore patterns are anchored with a leading slash on purpose. Theme Check
# matches unanchored globs against the full path, so a bare `dev/**` also
# matched a checkout at ~/dev/anvil-theme and the gate inspected 0 files.
ignore:
  - /node_modules/**
  - /.harness/**
  - /dev/**
  - /docs/**
  - /scripts/**
# Raw-byte ceilings (Shopify CLI 4.9.3 measures raw bytes, DECISIONS 16 and 20). The gzip budgets from
# ARCHITECTURE §10 / DESIGN-sections §6 are enforced per file by scripts/check-limits.sh.
AssetSizeCSS:
  enabled: true
  severity: error
  thresholdInBytes: 40000
AssetSizeJavaScript:
  enabled: true
  severity: error
  thresholdInBytes: 40000
RemoteAsset:
  severity: error
ParserBlockingScript:
  severity: error
ImgWidthAndHeight:
  severity: error
UnusedAssign:
  severity: error
